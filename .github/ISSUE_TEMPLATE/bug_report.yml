name: Bug Report
description: Report a problem with the installer
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please fill out the information below to help us investigate.

  - type: input
    id: platform
    attributes:
      label: Operating System
      description: OS and version that runs the installer, not the device receiving Home Assistant OS. See the README for beta requirements.
    validations:
      required: true

  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: "aarch64 or x86_64"
    validations:
      required: true

  - type: input
    id: package
    attributes:
      label: Package Type
      placeholder: "App, AppImage, Deb, Rpm, Nsis, or unbundled"

  - type: input
    id: flow
    attributes:
      label: Installation Flow
      placeholder: "flash, utm, proxmox, or application"
    validations:
      required: true

  - type: input
    id: stage
    attributes:
      label: Failed Stage

  - type: input
    id: error
    attributes:
      label: Error Category
      description: Diagnostics omit raw error details for privacy.

  - type: input
    id: version
    attributes:
      label: Installer Version
      description: Which version of the installer? (shown in app or filename)
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly
      placeholder: "When I clicked 'Flash', the app showed an error..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open the installer
        2. Select Raspberry Pi 5
        3. Insert SD card
        4. Click Flash
        5. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste the diagnostic log tail or attach logs/screenshots. This issue is public; review attachments for private information first.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I am running the latest version of the installer
          required: false
