name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Running the workflow by hand on main drafts a release of the next
  # version on the chosen channel, for someone to finish and publish. See
  # docs/spec/ci-cd.md.
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        options: [alpha, beta, stable]
  # The daily run on main only audits the dependencies, to catch advisories
  # published against what is already locked while nothing is merged.
  schedule:
    - cron: "17 4 * * *"

permissions: {}

# A new push to a pull request cancels the run for the push before it. Runs
# on main and release runs each get a group of their own and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line numbers are all a failing test's backtrace needs. Full debug info
  # makes the target directory, and so the cargo caches, several times larger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Release runs build the installers users download, so no job restores a
# cache there that another run could have written. Only runs on main save
# the cargo and apt caches: GitHub keeps 10 GB per repository, and a pull
# request's copy, which only that pull request can restore, evicts the ones
# on main that every pull request starts from.

jobs:
  audit-frontend:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # npm audit can't skip an advisory, so this reads its report and fails
      # on every advisory that isn't accepted below. Only accept one that has
      # no fixed release yet, and say here why it can't hurt us. Separate the
      # IDs with spaces.
      - name: Audit npm dependencies
        env:
          ACCEPTED_ADVISORIES: ""
        run: |
          npm audit --package-lock-only --json > "$RUNNER_TEMP/audit.json" || true
          jq -nr --arg accepted "$ACCEPTED_ADVISORIES" '
            ($accepted | split(" ")) as $accepted
            | (try input catch error("npm audit wrote no readable report"))
            | (.vulnerabilities // error("npm audit gave no report: \(.message // .error.summary // .)"))
            | [.[].via[] | objects | .id = (.url | ltrimstr("https://github.com/advisories/"))]
            | unique_by(.id)
            | (.[] | select(.id | IN($accepted[]) | not) | "::error::\(.title) (\(.url))"),
              (($accepted - map(.id))[] | "::warning::\(.) is no longer reported, so it can come off ACCEPTED_ADVISORIES")
          ' "$RUNNER_TEMP/audit.json" > "$RUNNER_TEMP/audit.txt"
          cat "$RUNNER_TEMP/audit.txt"
          if grep -q '^::error::' "$RUNNER_TEMP/audit.txt"; then
            exit 1
          fi

  audit-backend:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit, whose first
          # parent is main, so one more commit shows what it changes.
          fetch-depth: 2

      # The runs on main, daily ones included, catch advisories published
      # against what is already locked, so a pull request only needs the
      # audit when it changes Cargo.lock. The job itself still runs, so its
      # check always reports.
      - name: Check whether to audit
        id: lock
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]] || ! git diff --quiet HEAD^1 HEAD -- Cargo.lock; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-audit
        if: steps.lock.outputs.audit == 'true'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Rust dependencies
        if: steps.lock.outputs.audit == 'true'
        run: cargo audit

  # Picks the version of a release run from the existing version tags, once,
  # so all build jobs use the same one even if the month changes meanwhile.
  version:
    name: Pick the release version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      prerelease: ${{ steps.next.outputs.prerelease }}
      previous: ${{ steps.next.outputs.previous }}
    steps:
      # The release targets the commit this run builds, so it has to be one
      # that went through review on main and not one on a feature branch.
      # Anyone with write access may release an alpha; betas and stable
      # releases are for admins. The build and release jobs wait for this
      # job, so nothing is built if either check fails. Publishing is limited
      # separately, by the tag rulesets.
      - name: Check the run is on main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Releases are made from main, not $GITHUB_REF"
            exit 1
          fi

      # The triggering actor, not the actor: a re-run is checked against
      # whoever re-ran it.
      - name: Check who may release this channel
        if: inputs.channel != 'alpha'
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_TRIGGERING_ACTOR/permission" --jq .role_name)
          if [[ "$role" != admin ]]; then
            echo "::error::Only admins may release a $CHANNEL; $GITHUB_TRIGGERING_ACTOR has the $role role"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A draft has no tag until it's published, so another run on its
      # channel before that gets the same version again, and the release job
      # replaces the draft.
      - name: Pick the next version
        id: next
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name' > "$RUNNER_TEMP/tags"
          node scripts/next-version.mjs "$CHANNEL" < "$RUNNER_TEMP/tags" | tee -a "$GITHUB_OUTPUT"

      - name: Summarize
        env:
          VERSION: ${{ steps.next.outputs.version }}
          PREVIOUS: ${{ steps.next.outputs.previous }}
        run: |
          echo "Releasing **$VERSION** from \`$GITHUB_SHA\`, with changes since ${PREVIOUS:-the release GitHub picks}." >> "$GITHUB_STEP_SUMMARY"

  zizmor:
    name: Lint GitHub Actions
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: latest

  lint-frontend:
    name: Lint Frontend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Type-check source and tests
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Check localization catalog and placeholders
        run: |
          npm run localization:check
          npm run test:localization

      - name: Test the release version script
        run: npm run test:release

      - name: Check formatting
        run: npm run format:check

      # The browser mock reports a successful flash without writing anything,
      # so it may only exist in development builds. The unit and E2E tests
      # all run in development mode and can't see this; check the real build.
      - name: Check the production build has no browser mock
        run: |
          npm run build
          if grep -l -E 'isTauri. ?in window|mock-ticket|hai:mock-failure' dist/assets/*.js; then
            echo "::error::The production bundle contains the browser mock"
            exit 1
          fi

  lint-backend:
    name: Lint Backend (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-shear
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-shear

      - name: Cache cargo
        if: github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Ubuntu mirror the runners download from sometimes serves packages
      # at a few kB/s, which held the install up for as long as 45 minutes.
      # apt keeps what it downloads in a folder of its own that is cached, so
      # it only downloads packages that changed since main last saved it.
      # autoclean drops the versions the mirror no longer has, and the key
      # names the packages left, so main saves a new copy when they change.
      - name: Restore apt packages (Linux)
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/apt-archives/*.deb
          key: apt-${{ matrix.os }}-tauri-

      - name: Install Tauri dependencies (Linux)
        if: runner.os == 'Linux'
        id: apt
        env:
          APT_CACHE_KEY: apt-${{ matrix.os }}-tauri-
        run: |
          sudo install -d -o _apt /tmp/apt-archives/partial
          echo 'Dir::Cache::Archives "/tmp/apt-archives";' | sudo tee /etc/apt/apt.conf.d/90-ci-archives > /dev/null
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo apt-get autoclean
          echo "key=$APT_CACHE_KEY$(printf '%s\n' /tmp/apt-archives/*.deb | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save apt packages (Linux)
        if: runner.os == 'Linux' && github.event_name == 'push' && steps.apt.outputs.key != steps.apt-cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/apt-archives/*.deb
          key: ${{ steps.apt.outputs.key }}

      # Formatting and unused dependencies don't depend on the platform, so
      # one runner is enough. Clippy and the tests below do: the disk code is
      # split per OS with cfg(target_os), and each runner only sees its own.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Check generated TypeScript wire types
        if: runner.os == 'Linux'
        run: cargo test -p hai-core generated_types_are_current --locked

      - name: Check unused dependencies
        if: runner.os == 'Linux'
        run: cargo shear --locked --deny-warnings --format=github

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Clippy (mock backend)
        run: cargo clippy --workspace --all-targets --features hai-desktop/mock -- -D warnings

      - name: Run tests (mock backend)
        run: cargo test --workspace --features hai-desktop/mock

  test-frontend:
    name: Test Frontend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: frontend
          fail_ci_if_error: false

  # The E2E suite takes over ten minutes per browser in one job, longer than
  # any other job, so each browser's tests are split across three.
  test-e2e:
    name: Test E2E (${{ matrix.browser }}, ${{ matrix.shard }}/3)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      # The system packages behind `--with-deps` are cached like in
      # lint-backend, not with the browser.
      - name: Restore apt packages
        if: github.event_name != 'workflow_dispatch'
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/apt-archives/*.deb
          key: apt-playwright-${{ matrix.browser }}-

      # The E2E suite drives the Vite dev server in a browser, where the
      # frontend falls back to mock data instead of Tauri commands — no Rust
      # toolchain or Tauri system libraries needed.
      - name: Install Playwright browser
        id: apt
        env:
          APT_CACHE_KEY: apt-playwright-${{ matrix.browser }}-
        run: |
          sudo install -d -o _apt /tmp/apt-archives/partial
          echo 'Dir::Cache::Archives "/tmp/apt-archives";' | sudo tee /etc/apt/apt.conf.d/90-ci-archives > /dev/null
          npx playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get autoclean
          echo "key=$APT_CACHE_KEY$(printf '%s\n' /tmp/apt-archives/*.deb | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save apt packages
        if: github.event_name == 'push' && steps.apt.outputs.key != steps.apt-cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/apt-archives/*.deb
          key: ${{ steps.apt.outputs.key }}

      - name: Run E2E tests
        run: npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  test-backend:
    name: Test Backend (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo
        if: github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Cached like in lint-backend
      - name: Restore apt packages (Linux)
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/apt-archives/*.deb
          key: apt-${{ matrix.os }}-tauri-

      - name: Install Tauri dependencies (Linux)
        if: runner.os == 'Linux'
        id: apt
        env:
          APT_CACHE_KEY: apt-${{ matrix.os }}-tauri-
        run: |
          sudo install -d -o _apt /tmp/apt-archives/partial
          echo 'Dir::Cache::Archives "/tmp/apt-archives";' | sudo tee /etc/apt/apt.conf.d/90-ci-archives > /dev/null
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo apt-get autoclean
          echo "key=$APT_CACHE_KEY$(printf '%s\n' /tmp/apt-archives/*.deb | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save apt packages (Linux)
        if: runner.os == 'Linux' && github.event_name == 'push' && steps.apt.outputs.key != steps.apt-cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/apt-archives/*.deb
          key: ${{ steps.apt.outputs.key }}

      # Coverage comes from the Linux run; the other platforms only need to pass.
      - name: Run tests with coverage
        if: runner.os == 'Linux'
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Run tests
        if: runner.os != 'Linux'
        run: cargo test --workspace

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: backend
          fail_ci_if_error: false

      # This checks only public release metadata, never downloads an image.
      # Run after coverage upload so network/rate-limit failures cannot suppress coverage.
      - name: Check bundled boards against stable HAOS release assets
        if: runner.os == 'Linux'
        run: cargo test -p hai-core manifest::tests::bundled_boards_have_stable_release_assets -- --ignored --exact
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The community translates en.json in Lokalise. Runs on main upload it and
  # hand the build jobs every translation that fits it, so translators only
  # see reviewed copy and pull request builds are English only. Off until the
  # LOKALISE_PROJECT_ID variable is set. See docs/spec/ci-cd.md.
  translations:
    name: Sync translations
    if: vars.LOKALISE_PROJECT_ID && github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Holds the token, so a changed copy of the workflow on a branch can't
    # read it or write to the project
    environment: release
    env:
      LOKALISE: lokalise/lokalise-cli-2:v3.1.7@sha256:bbba240819aa93cf3926f1c1c88411de2c1c2fb92aad3ef45911453a6d1d9972
      LOKALISE_PROJECT_ID: ${{ vars.LOKALISE_PROJECT_ID }}
    # Only the two Lokalise steps get the token, and they run before npm
    # installs anything, like the Apple credentials in the build job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Placeholders and plurals stay ICU as written. A changed English
      # message makes its translations unverified (the project's Auto-toggle
      # Unverified automation), and the download leaves those out until a
      # translator updates them. A run of an older commit, like a re-run once
      # main has moved on, would put back English that main has changed since.
      # The image is pulled first, so the upload follows that check at once.
      - name: Upload the English catalog
        env:
          GH_TOKEN: ${{ github.token }}
          LOKALISE_TOKEN: ${{ secrets.LOKALISE_TOKEN }}
        run: |
          docker pull -q "$LOKALISE"
          if [[ $(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) != "$GITHUB_SHA" ]]; then
            echo "::notice::Not uploading en.json: main has moved on to a newer one"
            exit 0
          fi
          docker run --rm -v "$PWD/src/localization:/catalogs:ro" "$LOKALISE" lokalise2 \
            --token "$LOKALISE_TOKEN" --project-id "$LOKALISE_PROJECT_ID" \
            file upload --file /catalogs/en.json --lang-iso en \
            --convert-placeholders=false --replace-modified --poll --poll-timeout 5m \
            > "$RUNNER_TEMP/upload.json"
          cat "$RUNNER_TEMP/upload.json"
          # The CLI exits 0 when Lokalise rejects the file
          jq -e '.process.status == "finished"' "$RUNNER_TEMP/upload.json" > /dev/null

      # Lokalise keeps keys en.json dropped, so they are left out here. A
      # language with nothing translated is too: its empty catalog would stop
      # the app from trying the user's next language. Lokalise writes pt_BR
      # where the app looks for pt-BR. Only an async export works past 10,000
      # translations.
      - name: Download translations
        env:
          LOKALISE_TOKEN: ${{ secrets.LOKALISE_TOKEN }}
        run: |
          mkdir "$RUNNER_TEMP/lokalise"
          docker run --rm -v "$RUNNER_TEMP/lokalise:/out" "$LOKALISE" lokalise2 \
            --token "$LOKALISE_TOKEN" --project-id "$LOKALISE_PROJECT_ID" \
            file download --async --format json --original-filenames=false \
            --bundle-structure "%LANG_ISO%.json" --filter-data nonfuzzy \
            --export-empty-as skip --replace-breaks=false --unzip-to /out
          rm "$RUNNER_TEMP/lokalise/en.json"
          shopt -s nullglob
          for file in "$RUNNER_TEMP"/lokalise/*.json; do
            name=$(basename "$file" .json)
            jq --slurpfile english src/localization/en.json \
              'with_entries(select(.key | in($english[0]))) | select(length > 0)' \
              "$file" > "$RUNNER_TEMP/catalog.json"
            if [[ -s "$RUNNER_TEMP/catalog.json" ]]; then
              mv "$RUNNER_TEMP/catalog.json" "src/localization/${name//_/-}.json"
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      # Drops a message that doesn't fit the English, with a warning on the run
      - name: Check the translations
        env:
          LOCALIZATION_PRUNE: "1"
        run: npm run localization:check

      # en.json comes along, so the artifact exists before anything is translated
      - name: Upload translations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: translations
          path: src/localization/*.json
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    # Only release runs have a version job, and only main syncs translations;
    # elsewhere they're skipped.
    needs: [version, translations]
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.version.result == 'success' || needs.version.result == 'skipped') && (needs.translations.result == 'success' || needs.translations.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # The macOS builds of main and of releases are signed and notarized, so
    # the DMG they upload can be opened without Gatekeeper warnings. The Apple
    # credentials live in the protected `release` environment, which only main
    # may deploy to, so pull request builds never see them and stay unsigned.
    environment: ${{ matrix.os == 'macos-latest' && github.event_name != 'pull_request' && 'release' || '' }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUNDLE_DIR: target/${{ matrix.target }}/release/bundle
      SIGN_MACOS: ${{ matrix.os == 'macos-latest' && github.event_name != 'pull_request' }}
      # Bundles hai-live, the program on the live USB stick. Only release
      # builds use it, so other builds don't need hai-live built first.
      LIVE_USB_CONFIG: crates/hai-desktop/tauri.live-usb.conf.json
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on the oldest supported glibc, not ubuntu-latest.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }},x86_64-unknown-linux-musl

      # Tauri names the bundles and reports the app version after the version
      # in the workspace Cargo.toml, which stays at 0.0.0 on main. A release
      # run writes its version there before anything is built, and checks
      # that Cargo picked it up. Cargo updates Cargo.lock to match during the
      # build. No pattern anchors at the line end, where a Windows checkout
      # has a `\r`. `jq -j` writes no trailing newline, which jq on Windows
      # would write as CRLF and leave a `\r` in the version.
      - name: Set the release version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i.orig "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" Cargo.toml
          rm Cargo.toml.orig
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -j '.packages[] | select(.name == "hai-desktop") | .version')
          if [[ "$version" != "$VERSION" ]]; then
            echo "::error::Cargo.toml has the version $version instead of $VERSION"
            exit 1
          fi

      # Signed and release builds are what users install, so they compile
      # everything themselves instead of linking objects another run cached.
      # The macOS build on main is signed and saves no cache, so a pull
      # request's macOS build has none to restore either.
      - name: Cache cargo
        if: runner.os != 'macOS' && github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Cached like in lint-backend
      - name: Restore apt packages (Linux)
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/apt-archives/*.deb
          key: apt-${{ matrix.os }}-tauri-

      - name: Install Tauri dependencies (Linux)
        if: runner.os == 'Linux'
        id: apt
        env:
          APT_CACHE_KEY: apt-${{ matrix.os }}-tauri-
        run: |
          sudo install -d -o _apt /tmp/apt-archives/partial
          echo 'Dir::Cache::Archives "/tmp/apt-archives";' | sudo tee /etc/apt/apt.conf.d/90-ci-archives > /dev/null
          sudo apt-get update
          # The AppImage bundles these GStreamer plugins, so its WebKit can play audio
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio
          sudo apt-get autoclean
          echo "key=$APT_CACHE_KEY$(printf '%s\n' /tmp/apt-archives/*.deb | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save apt packages (Linux)
        if: runner.os == 'Linux' && github.event_name == 'push' && steps.apt.outputs.key != steps.apt-cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/apt-archives/*.deb
          key: ${{ steps.apt.outputs.key }}

      - name: Install dependencies
        run: npm ci

      - name: Download translations
        if: needs.translations.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: translations
          path: src/localization

      # The same static Linux program goes into every platform's app. Not
      # --locked: a release run has just changed the version in Cargo.toml.
      - name: Build hai-live
        run: cargo build --release -p hai-live --target x86_64-unknown-linux-musl
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld

      # Compiling and bundling are separate steps so that the Apple credentials
      # below are only ever in the environment of the bundler, never of npm or
      # cargo build scripts.
      - name: Build
        shell: bash
        run: npm run tauri build -- --target "$BUILD_TARGET" --config "$LIVE_USB_CONFIG" --no-bundle

      - name: Verify universal macOS binary
        if: runner.os == 'macOS'
        run: lipo "target/$BUILD_TARGET/release/hai-desktop" -verify_arch arm64 x86_64

      # Anything outside the OS (e.g. a Homebrew library picked up through
      # pkg-config) is missing on users' Macs and is refused by the hardened
      # runtime anyway, so the app would crash at launch.
      - name: Check the macOS binary only links system libraries
        if: runner.os == 'macOS'
        run: |
          libs=$(otool -L "target/$BUILD_TARGET/release/hai-desktop" | awk '/^\t/ {print $1}' | sort -u)
          echo "$libs"
          if bad=$(grep -vE '^(/usr/lib/|/System/Library/)' <<<"$libs"); then
            echo "::error::hai-desktop links non-system libraries: $bad"
            exit 1
          fi

      - name: Bundle
        if: env.SIGN_MACOS != 'true'
        shell: bash
        run: npm run tauri bundle -- --target "$BUILD_TARGET" --config "$LIVE_USB_CONFIG"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      # Tauri skips signing when APPLE_CERTIFICATE is missing and silently
      # skips notarization when the API key is, so check up front rather than
      # upload an unsigned DMG from main.
      - name: Check the signing credentials
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The secret $name is not set in the release environment"
              missing=1
            fi
          done
          exit "$missing"

      # notarytool reads the App Store Connect key from a file.
      - name: Write the notarization API key
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      # With these variables set, Tauri imports the certificate into a
      # temporary keychain, signs the app inside out with the hardened runtime,
      # notarizes it, staples the ticket and signs the DMG around it. It
      # refuses to sign if the certificate's name does not match
      # APPLE_SIGNING_IDENTITY, which catches an export of the wrong identity.
      - name: Bundle (signed)
        if: env.SIGN_MACOS == 'true'
        run: npm run tauri bundle -- --target "$BUILD_TARGET" --config "$LIVE_USB_CONFIG"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8

      # Tauri notarizes the app but not the DMG, and Gatekeeper assesses the
      # DMG itself when a download is opened (tauri-apps/tauri#7533).
      - name: Notarize and staple the DMG
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          dmg=("$BUNDLE_DIR"/dmg/*.dmg)
          if [[ ${#dmg[@]} -ne 1 || ! -f "${dmg[0]}" ]]; then
            echo "::error::Expected exactly one DMG, found: ${dmg[*]}"
            exit 1
          fi
          auth=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")

          echo "Notarizing ${dmg[0]}"
          # notarytool may exit non-zero on a rejection; print Apple's log
          # before failing, since it names the file that caused it.
          result=$(xcrun notarytool submit "${dmg[0]}" "${auth[@]}" --wait --output-format json) || true
          echo "$result"
          if [[ "$(jq -r .status <<< "$result")" != "Accepted" ]]; then
            xcrun notarytool log "$(jq -r .id <<< "$result")" "${auth[@]}" || true
            echo "::error::Apple did not accept the notarization of ${dmg[0]}"
            exit 1
          fi
          xcrun stapler staple "${dmg[0]}"

      # Tauri deletes the .app once it is in the DMG, as only the DMG is a
      # bundle target. Check the app inside the DMG: that is what users get.
      - name: Verify the signature and notarization
        if: env.SIGN_MACOS == 'true'
        run: |
          dmg=("$BUNDLE_DIR"/dmg/*.dmg)
          codesign --verify --strict --verbose=2 "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg[0]}"

          mountpoint=$(mktemp -d)
          hdiutil attach "${dmg[0]}" -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          app=("$mountpoint"/*.app)
          if [[ ${#app[@]} -ne 1 || ! -d "${app[0]}" ]]; then
            echo "::error::Expected exactly one app in the DMG, found: ${app[*]}"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${app[0]}"
          codesign --display --verbose=2 "${app[0]}"
          xcrun stapler validate "${app[0]}"
          spctl --assess --type execute --verbose=2 "${app[0]}"

      - name: Remove the notarization API key
        if: always() && env.SIGN_MACOS == 'true'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Uploads every installer as its own artifact, named after the file
      # itself, unarchived so users download the installer directly instead
      # of a zip. Fails if any expected bundle format is missing.
      - name: Upload installers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path')
            const {pathToFileURL} = require('url')
            // @actions/artifact is ESM-only; import it from the project's locked node_modules
            const {default: artifact} = await import(pathToFileURL(
              path.join(process.env.GITHUB_WORKSPACE, 'node_modules', '@actions', 'artifact', 'lib', 'artifact.js')
            ).href)

            const formats = {
              Linux: ['deb/*.deb', 'rpm/*.rpm', 'appimage/*.AppImage'],
              macOS: ['dmg/*.dmg'],
              Windows: ['nsis/*.exe'],
            }[process.env.RUNNER_OS]

            for (const format of formats) {
              const files = await (await glob.create(`${process.env.BUNDLE_DIR}/${format}`)).glob()
              if (files.length !== 1) {
                core.setFailed(`Expected exactly one installer for ${format}, found ${files.length}: ${files.join(', ')}`)
                return
              }
              core.info(`Uploading ${path.basename(files[0])}`)
              await artifact.uploadArtifact(
                path.basename(files[0]), files, path.dirname(files[0]), {skipArchive: true}
              )
            }

  # A release run releases the installers the build job produced in this
  # same run, once every other job has passed, as a draft that someone
  # finishes and publishes by hand (an alpha anyone with write access, a beta
  # or stable release an admin); until then nobody without write access can
  # see it.
  release:
    name: Release
    if: github.event_name == 'workflow_dispatch'
    # Two release runs at once would both find no draft and create two.
    concurrency:
      group: release
      cancel-in-progress: false
    needs:
      - version
      - audit-frontend
      - audit-backend
      - zizmor
      - lint-frontend
      - lint-backend
      - test-frontend
      - test-e2e
      - test-backend
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # The installers were uploaded unarchived, so each one downloads as the
      # file itself. Each artifact is named after its installer, which starts
      # with the product name; the pattern leaves out anything else in the
      # run, like the Playwright report of a failed attempt that was re-run.
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/installers
          pattern: Home Assistant Installer*
          merge-multiple: true

      # Provenance for every installer, tying it to this workflow run and
      # commit. Users check it with `gh attestation verify`, which matches by
      # content, so it doesn't matter that GitHub turns the spaces in the file
      # names into dots on upload. GitHub also lists each asset's SHA-256.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/installers/*

      # The release targets the commit this run built, and GitHub creates the
      # tag on it when someone publishes the draft. The tag rulesets decide
      # who may create which tag, and so who may publish which release. A
      # draft of the same version from an earlier run, like a re-run of this
      # one or of a run that failed after creating its draft, is replaced as a
      # whole, so its notes and assets always match the commit it targets. The
      # notes are GitHub's generated notes, grouped by .github/release.yml,
      # after the text in RELEASE_NOTES.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          INSTALLERS: ${{ runner.temp }}/installers
          RELEASE_NOTES: >-
            **Windows:** the installer isn't signed yet, so Microsoft Defender
            SmartScreen may warn about an unknown publisher when you open it.
            Choose **More info**, then **Run anyway**.
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --silent 2>/dev/null; then
            echo "::error::The tag $VERSION already exists"
            exit 1
          fi
          if draft=$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo "::error::The release $VERSION is already published"
              exit 1
            fi
            echo "Replacing the existing draft of $VERSION"
            gh release delete "$VERSION" --yes
          fi

          args=(--draft --target "$GITHUB_SHA" --title "$VERSION" --generate-notes --notes "$RELEASE_NOTES")
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          if [[ -n "$PREVIOUS" ]]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$VERSION" "${args[@]}" "$INSTALLERS"/*
