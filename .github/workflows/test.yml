name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  zizmor:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: latest

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check source and tests
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # The browser mock reports a successful flash without writing anything,
      # so it may only exist in development builds. The unit and E2E tests
      # all run in development mode and can't see this; check the real build.
      - name: Check the production build has no browser mock
        run: |
          npm run build
          if grep -l -E '__TAURI__|mock-ticket' dist/assets/*.js; then
            echo "::error::The production bundle contains the browser mock"
            exit 1
          fi

  lint-backend:
    name: Lint Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-shear
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-shear

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Tauri dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Formatting and unused dependencies don't depend on the platform, so
      # one runner is enough. Clippy and the tests below do: the disk code is
      # split per OS with cfg(target_os), and each runner only sees its own.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Check unused dependencies
        if: runner.os == 'Linux'
        run: cargo shear --locked --deny-warnings --format=github

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Clippy (mock backend)
        run: cargo clippy --workspace --all-targets --features hai-desktop/mock -- -D warnings

      - name: Run tests (mock backend)
        run: cargo test --workspace --features hai-desktop/mock

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: frontend
          fail_ci_if_error: false

  test-e2e:
    name: Test E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      # The E2E suite drives the Vite dev server in a browser, where the
      # frontend falls back to mock data instead of Tauri commands — no Rust
      # toolchain or Tauri system libraries needed. The system packages behind
      # `--with-deps` are not covered by the cache, so this always runs.
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        run: npm run test:e2e -- --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  test-backend:
    name: Test Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Tauri dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Coverage comes from the Linux run; the other platforms only need to pass.
      - name: Run tests with coverage
        if: runner.os == 'Linux'
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Run tests
        if: runner.os != 'Linux'
        run: cargo test --workspace

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: backend
          fail_ci_if_error: false

  test-windows-signing:
    name: Test Windows signing guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install NSIS for compile-only fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Test signing and NSIS failure guards
        shell: pwsh
        run: |
          ./.github/scripts/windows-signing.tests.ps1
          ./.github/scripts/windows-signing-nsis.tests.ps1

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Federation must trust only the upstream release environment.
    environment: ${{ matrix.os == 'windows-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release' || '' }}
    env:
      SIGN_WINDOWS: ${{ matrix.os == 'windows-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache cargo
        if: env.SIGN_WINDOWS != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Tauri dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build
        if: env.SIGN_WINDOWS != 'true'
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Compile Windows before signing login
        if: env.SIGN_WINDOWS == 'true'
        run: npm run tauri build -- --no-bundle

      - name: Test Windows signing guards
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/windows-signing.tests.ps1

      - name: Prepare Windows signing
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: ./.github/scripts/windows-signing.ps1 -Mode Prepare

      - name: Azure login for Windows signing
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
        env:
          AZURE_CORE_OUTPUT: none

      - name: Bundle and verify Windows signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          npm run tauri bundle -- --config "$env:RUNNER_TEMP/windows-signing/tauri-signing.json"
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows bundling failed' }
          # Tauri restores the unsigned build binary. The signing command
          # verifies the patched application before each package embeds it.
          foreach ($format in @(@{ Folder = 'msi'; Filter = '*.msi' }, @{ Folder = 'nsis'; Filter = '*.exe' })) {
            $installers = @(Get-ChildItem -LiteralPath "target/release/bundle/$($format.Folder)" -Filter $format.Filter -File)
            if ($installers.Count -ne 1) { throw "Expected exactly one $($format.Folder) installer" }
            ./.github/scripts/windows-signing.ps1 -Mode Verify -File $installers[0].FullName
          }

      - name: Remove Windows signing files
        if: always() && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP/windows-signing" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Test NSIS signing failure guards on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/windows-signing-nsis.tests.ps1 -MakeNsis "$env:LOCALAPPDATA/tauri/NSIS/makensis.exe"

      # Uploads every installer as its own artifact, named after the file
      # itself, unarchived so users download the installer directly instead
      # of a zip. Fails if any expected bundle format is missing.
      - name: Upload installers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path')
            const {pathToFileURL} = require('url')
            // @actions/artifact is ESM-only; import it from the project's locked node_modules
            const {default: artifact} = await import(pathToFileURL(
              path.join(process.env.GITHUB_WORKSPACE, 'node_modules', '@actions', 'artifact', 'lib', 'artifact.js')
            ).href)

            const formats = {
              Linux: ['deb/*.deb', 'rpm/*.rpm', 'appimage/*.AppImage'],
              macOS: ['dmg/*.dmg'],
              Windows: ['msi/*.msi', 'nsis/*.exe'],
            }[process.env.RUNNER_OS]

            for (const format of formats) {
              const files = await (await glob.create(`target/release/bundle/${format}`)).glob()
              if (files.length !== 1) {
                core.setFailed(`Expected exactly one installer for ${format}, found ${files.length}: ${files.join(', ')}`)
                return
              }
              core.info(`Uploading ${path.basename(files[0])}`)
              await artifact.uploadArtifact(
                path.basename(files[0]), files, path.dirname(files[0]), {skipArchive: true}
              )
            }
