[package]
name = "hai-core"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Core library for Home Assistant Installer"

[features]
default = ["proxmox", "utm", "live-usb"]
proxmox = []
utm = []
live-usb = ["dep:fscommon", "dep:flate2", "dep:gpt", "dep:hadris-iso", "dep:tar"]
mock = []

[dependencies]
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
liblzma = { workspace = true }
directories = { workspace = true }
fs2 = { workspace = true }
fatfs = { workspace = true }
urlencoding = { workspace = true }
tempfile = { workspace = true }

# Live USB image building
fscommon = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
gpt = { workspace = true, optional = true }
hadris-iso = { workspace = true, optional = true }
tar = { workspace = true, optional = true }

# macOS specific
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
libc = { workspace = true }
plist = { workspace = true }
security-framework = { workspace = true }
rustix = { workspace = true }

# Linux specific
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }
libc = { workspace = true }

# Windows specific
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
ts-rs = { workspace = true }
plist = { workspace = true }
tokio = { workspace = true, features = ["net", "test-util"] }
tempfile = { workspace = true }
serial_test = { workspace = true }
mockito = { workspace = true }
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
