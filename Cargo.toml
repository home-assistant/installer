[workspace]
resolver = "2"
members = ["crates/hai-core", "crates/hai-desktop", "crates/hai-live"]

[workspace.package]
version = "0.0.0"
authors = ["Open Home Foundation"]
license = "Apache-2.0"
edition = "2021"

[workspace.dependencies]
# Internal crates
hai-core = { path = "crates/hai-core" }

# Async runtime
tokio = { version = "1", features = ["time", "fs", "io-util", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# HTTP client
reqwest = { version = "0.13", features = ["stream", "json", "multipart", "form"] }

# Async utilities
futures-util = "0.3"

# Cryptography
sha2 = "0.11"
hex = "0.4"
rustls = "0.23"
rustls-platform-verifier = "0.7"

# Compression
# Static, so that the build never links a liblzma that users' machines lack
# (pkg-config finds Homebrew's on the macOS runners).
liblzma = { version = "0.4", features = ["static"] }
# Pure Rust xz decoder, for hai-live's static Linux build (no C toolchain needed)
lzma-rs = "0.3"

# Full-screen text interface of hai-live on the Linux console
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

# Live USB image building (hai-core's live-usb feature)
fscommon = "0.1"
flate2 = "1"
gpt = "4"
hadris-iso = { version = "=2.5.0", features = ["unstable-streaming"] }
tar = "0.4"

# File system
directories = "6"
fs2 = "0.4"
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }

# URL encoding
urlencoding = "2"

# Testing
tempfile = "3"
serial_test = "4"
mockito = "1"
rcgen = "0.14"
tokio-rustls = "0.26"
ts-rs = "12.0.1"

# macOS specific
core-foundation = "0.10"
plist = "1"
security-framework = "3"
rustix = { version = "1", features = ["fs", "net"] }

# Linux specific
zbus = { version = "6", default-features = false, features = ["proxy", "tokio"] }
libc = "0.2"

# Windows specific
windows-sys = { version = "0.61", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

# Tauri
tauri = { version = "~2.12.0", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "~2.8"
tauri-plugin-os = "=2.4.0"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
log = "0.4"
os_info = "3"
